services:
  postgres:
    image: postgres:16-alpine
    container_name: ${POSTGRES_CONTAINER_NAME:-ehms-postgres}
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hms_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hms_secure_pass}
      POSTGRES_DB: ${POSTGRES_DB:-hms_db}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-hms_admin} -d ${POSTGRES_DB:-hms_db}']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ${REDIS_CONTAINER_NAME:-ehms-redis}
    restart: unless-stopped
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  object-storage:
    image: minio/minio:latest
    container_name: ${MINIO_CONTAINER_NAME:-ehms-minio}
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - '${S3_PORT:-9000}:9000'
      - '${S3_CONSOLE_PORT:-9001}:9001'
    volumes:
      - minio_data:/data

  api:
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
    container_name: ${API_CONTAINER_NAME:-ehms-api}
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      DATABASE_URL: postgresql://${POSTGRES_USER:-hms_admin}:${POSTGRES_PASSWORD:-hms_secure_pass}@postgres:5432/${POSTGRES_DB:-hms_db}?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      PORT: ${PORT:-4000}
      CLIENT_URL: ${CLIENT_URL:-http://localhost:3000}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-hms_super_secret_access_jwt_key_2026_dev_secure}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-hms_super_secret_refresh_jwt_key_2026_dev_secure}
    ports:
      - '${PORT:-4000}:4000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: infrastructure/docker/web.Dockerfile
    container_name: ${WEB_CONTAINER_NAME:-ehms-web}
    restart: unless-stopped
    ports:
      - '${WEB_PORT:-3000}:3000'
    depends_on:
      - api

  worker:
    build:
      context: .
      dockerfile: infrastructure/docker/worker.Dockerfile
    container_name: ${WORKER_CONTAINER_NAME:-ehms-worker}
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      DATABASE_URL: postgresql://${POSTGRES_USER:-hms_admin}:${POSTGRES_PASSWORD:-hms_secure_pass}@postgres:5432/${POSTGRES_DB:-hms_db}?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      - postgres
      - redis

volumes:
  postgres_data:
  redis_data:
  minio_data:
