[package]
name = "ethiopian_hms_desktop"
version = "1.0.0"
description = "Ethiopian Hotel Management System Native Desktop & Mobile Client"
authors = ["Ethiopian HMS Team"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.31", features = ["bundled"] }
tokio = { version = "1", features = ["full"] }
thiserror = "1.0"
log = "0.4"
