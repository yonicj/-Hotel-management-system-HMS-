name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  ci:
    name: Build, Lint & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: hms_admin
          POSTGRES_PASSWORD: hms_secure_pass
          POSTGRES_DB: hms_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U hms_admin -d hms_db"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      NODE_ENV: test
      PORT: 4000
      DATABASE_URL: postgresql://hms_admin:hms_secure_pass@localhost:5432/hms_db?schema=public
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      REDIS_URL: redis://localhost:6379
      CLIENT_URL: http://localhost:3000
      NEXT_PUBLIC_API_URL: http://localhost:4000/api
      JWT_SECRET: ci-jwt-secret-at-least-32-characters-long
      JWT_ACCESS_SECRET: hms_super_secret_access_jwt_key_2026_dev_secure
      JWT_REFRESH_SECRET: hms_super_secret_refresh_jwt_key_2026_dev_secure
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Generate Prisma Client
        run: pnpm --filter=@ehms/api prisma:generate

      - name: Build
        run: pnpm build

      - name: Type Check
        run: pnpm type-check

      - name: Lint
        run: pnpm lint

      - name: Setup Database (Migrate & Seed)
        run: |
          pnpm --filter=@ehms/api prisma:generate
          pnpm --filter=@ehms/api prisma:migrate:deploy
          pnpm db:seed

      - name: Test
        run: pnpm test
